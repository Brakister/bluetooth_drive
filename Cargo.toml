[package]
name = "btguard"
version = "1.0.0"
edition = "2021"
description = "BTGuard - supervisor e reparador do radio Bluetooth USB (CSR Nanosira)"

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_EventLog",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Bluetooth",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
] }

[[bin]]
name = "btguard"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
